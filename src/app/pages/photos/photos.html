<div class="grid">
  @for (photo of photos(); track photo.id) {
    <img [src]="src(photo.id)" [alt]="'Photo ' + photo.id" loading="lazy" />
  }
</div>

@if (failed()) {
  <div class="status">
    <p>Failed to load photos</p>
    <button matButton="outlined" (click)="loadMore()">Retry</button>
  </div>
} @else if (loading()) {
  <div class="status">
    <mat-spinner diameter="48" />
  </div>
}

<app-photos-grid
  [photos]="photos()"
  [favoriteIds]="favoriteIds()"
  (photoSelected)="addToFavorites($event)"
/>

@if (failed()) {
  <div class="status">
    <p>Failed to load photos</p>
    <button matButton="outlined" (click)="loadMore()">Retry</button>
  </div>
} @else if (loading()) {
  <div class="status">
    <mat-spinner diameter="48" />
  </div>
} @else if (!done()) {
  <div class="sentinel" appInfiniteScroll (scrolled)="loadMore()"></div>
} @else {
  <p class="end">No more photos to load</p>
}

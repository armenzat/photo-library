<button type="button" class="card" (click)="selected.emit()">
  <img
    [src]="src()"
    [alt]="'Photo ' + photo().id"
    [class.loaded]="loaded()"
    (load)="loaded.set(true)"
    loading="lazy"
  />
  @if (favorite()) {
    <span class="favorite" role="img" aria-label="In favorites">
      <mat-icon fontSet="material-symbols-outlined">favorite</mat-icon>
    </span>
  }
</button>
